<div class="document-container">
    <div class="document-header">
        <h1>Additional Documents</h1>
        <p>Upload Related Documents. This step is optional.</p>
    </div>

    <div class="upload-section">
        <div class="form-group">
            <label for="document">Upload Additional Document:</label>
            <div class="file-upload-container">
                <div class="upload-circle" [class.has-file]="document" *ngIf="!document">
                    <input type="file" id="document" (change)="onFileSelected($event)" accept=".pdf,.jpg,.jpeg,.png" />
                    <mat-icon class="upload-icon">cloud_upload</mat-icon>
                    <span class="circle-text">Attach Documents</span>
                </div>
                <div class="file-selected" *ngIf="document && !documentUrl">
                    <div class="file-info">
                        <mat-icon>description</mat-icon>
                        <span>{{ getFileName() }}</span>
                        <button type="button" class="remove-btn" (click)="removeFile()">
                            <mat-icon>close</mat-icon>
                        </button>
                    </div>
                </div>
                <div class="image-preview" *ngIf="documentUrl">
                    <img [src]="documentUrl" alt="Document Preview" class="preview-image" />
                    <button type="button" class="remove-btn-overlay" (click)="removeFile()">
                        <mat-icon>close</mat-icon>
                    </button>
                    <div class="image-name">{{ getFileName() }}</div>
                </div>
                
                <small class="file-info">Supported formats: PDF, JPG, JPEG, PNG (Max 5MB)</small>
            </div>
        </div>

    </div>
    
    <div class="nav-buttons">
        <button class="nav-btn secondary" (click)="goToForm()">
            <mat-icon>arrow_back</mat-icon>
            Previous
        </button>
        <button class="nav-btn primary" (click)="submitDocument()">
            Next
            <mat-icon>arrow_forward</mat-icon>
        </button>
    </div>
</div>
