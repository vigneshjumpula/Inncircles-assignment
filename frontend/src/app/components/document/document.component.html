<div class="document-container">
    <div class="document-header">
        <h1>Additional Documents</h1>
        <p>Upload Related Documents. This step is optional.</p>
    </div>

    <div class="upload-section">
        <div class="form-group">
            <label for="document">Upload Additional Document:</label>
            <div class="file-upload-container">
                <div class="upload-circle" [class.has-file]="docment">
                    <input type="file" id="document" (change)="onFileSelected($event)" accept=".pdf,.jpg,.jpeg,.png" />
                    <mat-icon class="upload-icon">{{ docment ? 'check_circle' : 'cloud_upload' }}</mat-icon>
                    <span class="circle-text">{{ docment ? 'Document Uploaded' : 'Attach Documents' }}</span>
                    <span class="file-name" *ngIf="docment">{{ getFileName() }}</span>
                </div>
                <small class="file-info">Supported formats: PDF, JPG, JPEG, PNG (Max 5MB)</small>
            </div>
            <button class="remove-file-btn" *ngIf="docment" (click)="removeFile()">
                <mat-icon>delete</mat-icon>
                Remove File
            </button>
        </div>

    </div>
    
    <div class="nav-buttons">
        <button class="nav-btn secondary" (click)="goToForm()">
            <mat-icon>arrow_back</mat-icon>
            Previous
        </button>
        <button class="nav-btn primary" (click)="submitDocument()">
            Next
            <mat-icon>arrow_forward</mat-icon>
        </button>
    </div>
</div>
